[project]
name = "race-predictions-ai"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.136.3",
    "f1models",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]

[tool.uv.workspace]
members = [
    "packages/pitml",
    "packages/models",
]

[tool.uv.sources]
f1models = { workspace = true }
pitml = { workspace = true }
